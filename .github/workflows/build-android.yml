name: Build & Release Aurns (v1.4.0+)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Aurns APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Read Version from version.txt
        run: |
          RAW_VER=$(head -n 1 version.txt | sed 's/^\xEF\xBB\xBF//' | tr -d '\r\n ')
          echo "RAW_VER=${RAW_VER}" >> "$GITHUB_ENV"
          echo "APP_TAG=v${RAW_VER#v}" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Build Android Release APK
        working-directory: ./android
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Prepare APK File
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Aurns.apk
          ls -lh Aurns.apk Aurns.exe

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aurns-Android-${{ env.APP_TAG }}
          path: Aurns.apk
          retention-days: 30

      - name: Sync GitHub Release (${{ env.APP_TAG }})
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ env.APP_TAG }}" >/dev/null 2>&1; then
            gh release upload "${{ env.APP_TAG }}" Aurns.exe Aurns.apk --clobber
          else
            NOTES=$(tail -n +3 version.txt | tr -d '\r')
            if [ -z "$NOTES" ]; then
              NOTES="ΛURNS ${{ env.APP_TAG }} Bilgisayar (Windows) ve Telefon (Android) sürümü."
            fi
            gh release create "${{ env.APP_TAG }}" Aurns.exe Aurns.apk \
              --title "${{ env.APP_TAG }} — ΛURNS (Bilgisayar & Android)" \
              --notes "$NOTES" \
              --latest
          fi
